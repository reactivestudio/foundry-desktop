<style>
/* =====================================================================
   Цветовая модель по букве канона 06-color:
   «серые карточки, у активного change'а тонкая цветная полоса стадии»,
   правило 60-30-10 — 60 поверхности, 30 альфа-белый текст и хром, 10 акцент.
   Цвет никогда не размазан полупрозрачной заливкой по большой площади:
   тёплый тон на 11 процентов поверх фиолетово-чёрной базы даёт оливу, не янтарь.
   Хрома появляется только полной насыщенностью и на малой площади —
   чип, полоса, число, точка.
   ===================================================================== */

  /* Шкала поверхностей переопределялась здесь трижды подряд — слой писался
     ревизия за ревизией, и каждая оставляла свой `:root`. Последняя из них
     уехала в канон (tokens.json, 06-color.md §5.2, 09-surfaces.md §1.1), и
     макет объявляет её сам; держать копию в слое — значит завести второе
     место, где живёт то же число. Осталось только то, чего в каноне нет. */
  :root { --sem-info: var(--brand-purple);
          --glow-live: 0 0 10px rgba(139,92,246,0.45), 0 0 28px rgba(139,92,246,0.14); }

  .wrap, .block.wide { max-width: 1700px; }
  .block.wide { margin-left: 0; }
  /* Флаг листа — флаг кадра. Подписи вставали на нулевой пиксель: первая
     литера срезалась кромкой, а подпись висела на 17 px левее того окна,
     которое называет. 17 = поле окна (16) плюс его кромка. */
  .block.wide .sec-head, .block.wide .caption { margin-left: calc(var(--s4) + 1px);
                                                max-width: 100ch; }

  .two { display: grid; grid-template-columns: 44px 214px minmax(0,1fr); min-height: 508px; }
  .two.short { min-height: 512px; }
  .win.ovl .pane.list { position: relative; }
  /* канвас доски — самая тёмная плоскость окна: карточки поднимаются НАД ней.
     Поздний блок макета переводил .pane.list на bg-surface, из-за чего полоса
     пайплайнов светилась подложкой панели. */
  .pane.list { display: flex; flex-direction: column; background: var(--bg-base); }
  .pipe-bar, .canvas-head, .board, .toast-dock { background: var(--bg-base); }
  .pipe-tab.sel { background: none; }

  /* ——— слой «30»: белая масса, которой на экране не было вовсе ——— */
  .canvas-head { display: flex; align-items: baseline; gap: var(--s3); padding: var(--s5) var(--s5) 0; background: var(--bg-base); }
  .ch-title { font-size: 20px; font-weight: 600; letter-spacing: -0.014em; color: var(--t-primary);
              margin: 0; font-variant-numeric: tabular-nums; }
  .ch-sub { font-size: 11px; color: var(--t-secondary); font-variant-numeric: tabular-nums; }
  .canvas-head .silent { font-size: 11px; color: var(--t-tertiary); }

  /* ——— пайплайны: флаговый ряд без рамок, мета только у выбранного ——— */
  .pipe-bar { background: transparent; border-bottom: none; padding: var(--s4) var(--s5) 0; gap: var(--s5); align-items: flex-start; }
  /* мета выбранного пайплайна встаёт в ту же строку: висячая вторая строка ломала ряд */
  .pipe-tab, .pipe-tab.sel { border: none; background: transparent; padding: 0; min-width: 0;
                             flex-direction: row; align-items: baseline; gap: var(--s2); }
  .pipe-name { font-size: 13px; color: var(--t-tertiary); font-weight: 500; }
  .pipe-tab.sel .pipe-name { color: var(--t-primary); font-weight: 600; }
  .pipe-name .pp { color: inherit; opacity: 0.5; }
  .pipe-name .pn { margin-left: 7px; color: var(--t-tertiary); font-variant-numeric: tabular-nums; }
  .pipe-tab.sel .pipe-name .pn { color: var(--t-secondary); }
  .pipe-tab:not(.sel) .pipe-meta { display: none; }
  
  .pipe-meta { color: var(--t-tertiary); }

  /* ——— доска: колонки одной ширины, без плашек. «Ящик в ящике» бюро не прощает ——— */
  .board { gap: var(--s4); padding: var(--s5) var(--s5) 0; align-items: flex-start; flex: 1; }
  .kb-col { flex: 0 0 148px; gap: var(--s3); min-height: 0; }
  .kb-col-head { padding: 0 1px 5px; gap: 3px; }
  .kb-col-head .kbt { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--t-tertiary); }
  .kb-col-head .kbn { font-size: 12px; font-weight: 600; color: var(--t-secondary); font-variant-numeric: tabular-nums; }
  .kb-col-head .kbart { padding-left: 0; color: var(--t-tertiary); }
  .kb-col-head .kdot { display: none; }
  .kb-col.done .kbt { color: var(--sem-success); opacity: 0.7; }
  /* якорь — не залитая площадь, а число полной насыщенности */
  .kb-col.wait .kbt { color: var(--t-secondary); }
  .kb-col.wait .kbn { color: var(--sem-warning); }
  .kb-col-head .kbart.wait { font-family: inherit; font-size: 11px; color: var(--sem-warning); opacity: 0.82; }
  .kb-col.collapsed { background: rgba(255,255,255,0.022); align-self: flex-start; padding: 10px 0; }

  /* ——— карточки: серые, без бордера покоя. Отделение на тёмном — свет по кромке ——— */
  /* высота карточки фиксирована (модуль 4): ряды идут сквозь все колонки насквозь */
  .kb-card { position: relative; overflow: hidden; border: none; border-radius: 10px;
             background: var(--bg-surface); padding: var(--s2); gap: var(--s1); height: 96px;
             justify-content: flex-start;
             box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
  .kb-card .kc-foot, .kb-card .kc-art { margin-top: auto; }
  .kb-card:hover { background: #151020; box-shadow: inset 0 1px 0 rgba(255,255,255,0.11); }
  .kb-card .kc-title { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.93); }
  .kb-card .kc-branch { font-size: 10px; color: var(--t-tertiary); }
  .kb-card .kc-pict { color: var(--t-tertiary); }
  .kb-card .kc-foot { color: var(--t-tertiary); }

  /* ОДНО СРЕДСТВО НА ОДНУ ЗАДАЧУ: состояние change'а — левая полоса, всегда и только она.
     Полоса стоит на кромке, поэтому цвет берётся полной насыщенностью и не мутнеет. */
  .kb-card.live::before, .kb-card.wait::before, .kb-card.fail::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; }
  .kb-card.live::before { background: var(--brand-purple); }
  .kb-card.wait::before { background: var(--sem-warning); }
  .kb-card.fail::before { background: var(--sem-error); }
  .kb-card.live { border: none; background: var(--bg-surface); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
  .kc-art.live { color: #B79BFA; }
  /* значение состояния — простым цветным текстом, без плашки: плашка это ещё один ящик */
  .st { font-weight: 600; font-variant-numeric: tabular-nums; }
  .st.warn { color: var(--sem-warning); }
  .st.err  { color: var(--sem-error); }
  .st-note { color: var(--t-tertiary); }
  /* выбрано — ультрамарин, единственный акцент действия на экране */
  .kb-card.sel { background: rgba(47,92,255,0.12); box-shadow: inset 0 0 0 2px rgba(47,92,255,0.55); }
  /* принято — тише всех */
  .kb-col.done .kb-card { background: rgba(255,255,255,0.045); box-shadow: none; }
  .kb-col.done .kb-card .kc-title { color: var(--t-secondary); font-weight: 500; }

  .chip { font-variant-numeric: tabular-nums; }
  .fold-note { border: none; color: var(--t-tertiary); text-align: left; padding: 2px 1px; font-size: 10px; }

  /* ——— сайдбар: белая масса нужна и здесь ——— */
  /* Скругление подложки заводилось состоянием, а не объектом: у выбранного
     пункта и у ховера ЛИСТА оно было, а у ховера ЖИВОГО сайдбара — нет, и
     наведение красило строку прямоугольником с острыми углами. Форма
     принадлежит объекту, состояние меняет только заливку. */
  .side-item { color: var(--t-secondary); border-radius: var(--r-m); }
  .side-item.sel { color: var(--t-primary); }

  /* скрим обязан гасить доску, иначе инспектор не читается как слой поверх */
  .board-scrim { background: rgba(0,0,0,0.62); backdrop-filter: saturate(0.7); }
  .win.ovl .kb-card.sel { z-index: 3; }
  .toast-dock { padding: var(--s4) var(--s5) var(--s5); display: flex; justify-content: center; }
  .toast-dock .toast { width: 360px; }

  /* ——— проход по мелочам: высота кодируется светом по кромке, не темнотой ——— */
  .titlebar { box-shadow: inset 0 -1px 0 rgba(255,255,255,0.045); }
  .win-title { color: var(--t-secondary); }
  .rl { color: var(--t-secondary); }
  /* `.rl.sel { color: #A9BEFF }` отсюда снят: он не красил НИЧЕГО. Знак
     выбранного раздела перекрыт правилом `.rl.sel .ic` (белый), подпись —
     правилом `.rl.sel .rl-tx` (тоже белый), а больше текста в значке нет.
     Правило, которое ничего не красит, читается как «здесь есть голубой
     акцент» — и следующая правка на него сошлётся. */
  .side-head { color: var(--t-primary); letter-spacing: -0.01em; }
  .side-item .count { font-variant-numeric: tabular-nums; }

  /* поздние групповые правила макета сажают вкладку на bg.raised — вкладке подложка не нужна */
  .pipe-bar .pipe-tab, .pipe-bar .pipe-tab.sel { background: none; box-shadow: none; }
  .pipe-name .pp { background: none; }

  /* один primary на экран: «Принять» — залитая, «Вернуть» — тихая.
     Янтарная обводка у вторичной кнопки к тому же сталкивалась со значением
     «ждёт» на доске: один цвет не может значить два разных. */
  .ins-foot .btn.secondary, .btn.secondary { background: none; border: 1px solid rgba(255,255,255,0.14);
                                             color: var(--t-secondary); box-shadow: none; }
  .btn.secondary:hover { border-color: rgba(255,255,255,0.26); color: var(--t-primary); }
  .btn.secondary kbd { color: var(--t-tertiary); }
  /* тишина агента живёт на карточке агента */
  .acs-l .silent { color: var(--t-tertiary); }

/* =====================================================================
   ИТЕРАЦИЯ ПО РЕФЕРЕНСАМ. Три вывода, снятых с присланных картинок.
   1. Поверхности НЕЙТРАЛЬНЫ. Хрома фона — источник «грязи»: фиолетовая
      подложка тянет к себе любой тёплый акцент. База остаётся #05030D
      (преемственность с онбордингом), но всё, что выше базы, обесцвечено
      почти до серого — тогда цветное на нём читается цветным.
   2. Панели — отдельные плавающие плиты: без бордеров, скруглённые,
      разделённые зазором, а не примыкающие встык. Снимает противоречие
      раздела 01 макета, где подпись обещала одно, а CSS делал другое.
   3. Цвет приходит ЗАЛИТЫМ чипом малой площади, а не полосой и не
      полупрозрачной заливкой. Полоса стадии снята: чип несёт и цвет,
      и слово, значит средство одно, а не два.
   ===================================================================== */

  /* плиты */
  .win { padding: 0 var(--s2) var(--s2); }
  .titlebar { box-shadow: none; background: none; }
  .two, .two.short { gap: var(--s2); grid-template-columns: 56px 222px minmax(0,1fr); background: none; }
  .pane, .rail { border: none; border-radius: var(--r-xl); overflow: hidden; }
  .rail { background: var(--bg-surface); padding: var(--s3) 0; gap: var(--s1); align-items: center; }
  .pane.sidebar { background: var(--bg-surface); border-right: none; }
  .pane.list { background: var(--bg-surface); }
  .pipe-bar, .canvas-head, .board, .toast-dock { background: none; }
  .pane.inspector, .overlay-insp { background: var(--bg-raised); border: none; }

  /* карточки поднимаются над плитой канваса — как в референсе */
  .kb-card { background: var(--bg-raised); box-shadow: none; border-radius: var(--r-l); }
  .kb-card:hover { background: #23232A; box-shadow: none; }
  .kb-col.done .kb-card { background: rgba(255,255,255,0.035); }
  .kb-card.sel { background: rgba(47,92,255,0.16); box-shadow: inset 0 0 0 2px rgba(47,92,255,0.6); }
  /* полосы больше нет: её работу делает чип */
  .kb-card.live::before, .kb-card.wait::before, .kb-card.fail::before { display: none; }

  /* ——— чип: полная насыщенность, крошечная площадь ——— */
  .st, .kc-art.live { display: inline-flex; align-items: center; gap: 4px;
                      padding: 2px var(--s2); border-radius: 999px; font-size: 10px;
                      font-weight: 600; letter-spacing: 0.005em; line-height: var(--s4); }
  .st.warn { background: #FBBF24; color: #17130A; }
  
  .kc-art.live { background: #7C4DF5; color: #FFFFFF; }
  .kc-art.live span:first-child { opacity: 0.72; }

  /* инспектор лежит ПОВЕРХ канваса — высота кодируется тенью и светом по кромке */
  /* инспектор приходит ПОВЕРХ доски и обязан читаться слоем, а не четвёртой
     колонкой: его отступают от кромок плиты, кладут на тень и поднимают светом
     по верхней кромке. Доска под ним не пересобирается — карточка остаётся там,
     где на неё смотрел глаз. */
  .overlay-insp { top: var(--s4); bottom: var(--s4); right: var(--s4); border-radius: var(--r-xl);
                  box-shadow: 0 24px 64px rgba(0,0,0,0.62), inset 0 1px 0 rgba(255,255,255,0.06); }
  .board-scrim { border-radius: var(--r-xl); }
  .side-item.sel { background: rgba(255,255,255,0.06); }
  .rl.sel { background: rgba(255,255,255,0.07); border-radius: var(--r-m); }

  /* ветка обязана помещаться целиком: «research/liquid-gla…» — не имя ветки */
  .kb-card .kc-foot { gap: var(--s2); }
  /* принятое тихо, но не невидимо */
  .kb-col.done .kb-card { background: rgba(255,255,255,0.055); }
  /* белым по цветному — только на фоне, который это выдерживает */
  /* заливки чипов доведены до 4.5:1 по белому — чип это текст, а не украшение */
  .st.err { background: #CC3A34; color: #FFFFFF; }

  /* артефакт — документ на 214 строк, а не карточка: он обязан обрываться
     затуханием, а не срезом по букве, иначе обрыв читается браком вёрстки */
  .overlay-insp .artifact { overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 44px), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 44px), transparent); }

/* ——— иконки: один штриховой набор на весь экран ———
   Разнобой из юникодных знаков (▤ ▦ ◔ ¶ ⟳) не был набором: у них разный вес,
   разная оптическая плотность и разное происхождение. Здесь одна геометрия —
   штрих 1.5 на сетке 16, круглые концы, без заливок; вес штриха согласован
   с весом текста рядом. */
  .ic { width: 16px; height: 16px; display: block; flex: none;
        fill: none; stroke: currentColor; stroke-width: 1.5;
        stroke-linecap: round; stroke-linejoin: round; }
  .ic-s { width: 13px; height: 13px; stroke-width: 1.6; }
  .rl .ic { width: 17px; height: 17px; }
  .side-item .ico, .kc-top .kc-pict, .pipe-name .pp, .toast .t-ic { display: flex; align-items: center; }
  .kc-top { align-items: center; gap: var(--s2); }
  .kc-top .kc-pict { margin-top: 1px; align-self: flex-start; }

/* ——— линейки сняты: разделяет воздух ———
   Полоса во всю ширину под титлбаром резала окно надвое и не разделяла ничего:
   плиты и так стоят зазором. Внутри инспектора линейки заменены отступом. */
  .titlebar { background: none; border-bottom: none; backdrop-filter: none; }
  .insp-head { border-bottom: none; padding-bottom: var(--s2); }
  .step-cap { border-bottom: none; padding-bottom: var(--s5); }
  .actionbar { border-top: none; background: none; padding-top: 0; }
  .overlay-insp .artifact { padding-top: 0; }

/* сайдбар без карточки агента: список прижат к верху, низ оставлен пустым */
  .pane.sidebar { padding-bottom: var(--s4); }

  /* счётчик не должен садиться на штрих иконки: его выносят за габарит и
     обводят цветом плиты, тогда он читается меткой, а не грязью в углу */
  .rl-b { top: -2px; right: -3px; height: 14px; min-width: 14px; padding: 0 4px;
          font-size: 10px; font-weight: 700; box-shadow: 0 0 0 2px var(--bg-surface);
          background: rgba(255,255,255,0.14); color: var(--t-primary); }
  .rl-b.warn { background: var(--sem-warning); color: #201700; }
  .rail { padding: var(--s3) 0 var(--s4); gap: var(--s1); }
  .rl { width: 32px; height: 32px; }

  /* −204 — это удалённые строки диффа, а не ошибка. Красный на доске уже занят
     значением «упало»; два смысла одним цветом не живут. */
  .kb-card .kc-foot .neg, .kb-card .kc-foot .diff { color: var(--t-tertiary); }

  /* тост: полоса-таймер была самым громким ультрамарином на экране и дублировала
     то, что тост и так делает — исчезает. Убрана; ширины хватает, чтобы имя
     ветки не ломалось на две строки. */
  /* Тост стоял фиксированной шириной 420 px при содержимом на 350: поле слева
     14, справа 68 — хвост пустоты почти в целое слово. Коробка сообщения
     обязана быть по сообщению. */
  .toast-dock .toast { width: max-content; max-width: 520px; }
  .toast .bar { display: none; }
  .toast .tx { white-space: nowrap; }
  .toast { border: none; background: var(--bg-overlay); }

  /* длинное имя change'а обрывается на второй строке многоточием, а не режется
     кромкой: полное имя живёт в инспекторе. Ряд при этом не сбивается. */
  .kb-card .kc-title { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
                       overflow: hidden; }
  /* счётчик колонки — это счётчик карточек, и он не может быть янтарным, пока
     янтарь значит «ждёт»: два смысла одним цветом не живут. Якорь несёт строка. */
  .kb-col.wait .kbn { color: var(--t-secondary); }
  .side-cap { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
              color: var(--t-disabled); padding: 0 var(--s2) var(--s2); }
  .side-item .count.warn { color: var(--sem-warning); }
  .side-item .count.err  { color: var(--sem-error); }
  .toast-dock { padding-top: var(--s6); }

  /* точка «агент работает» внутри чипа: маркер, а не юникодный знак */
  .kc-art.live .dot { width: 5px; height: 5px; border-radius: 999px;
                      background: currentColor; opacity: 0.75; flex: none; }

  /* ——— деградация: что случилось · чем грозит · что делать ———
     Полоса живёт над доской, а не поверх неё: она не блокирует чтение доски,
     потому что доска всё ещё полезна — просто устарела. */
  .degrade { display: flex; align-items: center; gap: var(--s3);
             margin: var(--s4) var(--s5) 0; padding: var(--s3) var(--s4);
             border-radius: var(--r-l); background: var(--bg-raised);
             box-shadow: inset 0 0 0 1px rgba(251,191,36,0.28); }
  .degrade .dg-ic { color: var(--sem-warning); display: flex; }
  .degrade .dg-tx { font-size: 12px; color: var(--t-secondary); flex: 1; }
  .degrade .dg-tx b { color: var(--t-primary); font-weight: 600; }
  .degrade .dg-act { font-size: 12px; color: #A9BEFF; white-space: nowrap;
                     border: 1px solid rgba(255,255,255,0.16); border-radius: var(--r-m);
                     padding: 3px 10px; }
  /* доска-снимок: живое от неживого отличается насыщенностью, не рамкой */
  .win:not(.ovl) .degrade ~ .board .kb-card { opacity: 0.72; }
  .win:not(.ovl) .degrade ~ .board .kb-card .st.err { opacity: 1; }

  /* пустая колонка подсказывает следующий шаг, а не констатирует пустоту */
  .kb-empty { font-size: 11px; color: var(--t-tertiary); line-height: 1.45;
              padding: var(--s2) var(--s2) 0; }

  .st { white-space: nowrap; }
  /* «0» в срезе — не тревога и не достижение, просто ноль */
  .side-item .count { font-variant-numeric: tabular-nums; }


  /* --- 23. лист состояний --- */
  .spec-win { padding: var(--s2) !important; }
  .spec { background: var(--bg-surface); border-radius: var(--r-xl); padding: var(--s6); }
  .spec-row { margin-bottom: var(--s6); }
  .spec-row:last-child { margin-bottom: 0; }
  .spec-cap { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
              color: var(--t-disabled); margin-bottom: var(--s4); }
  /* repeat(6, 1fr) — это minmax(auto, 1fr): дорожка растёт под самое широкое
     содержимое, и у каждого ряда листа получалась СВОЯ сетка. Замер: вторая
     ячейка стояла на 315 в ряду «Карточка change» и на 424 в ряду «Кнопки
     инспектора». Взгляд не мог пройти столбцом по листу — а лист затем
     и нужен, чтобы состояния сравнивать по вертикали. minmax(0,1fr) делит
     ширину поровну независимо от содержимого. */
  .spec-set { display: grid; grid-template-columns: repeat(6, minmax(0,1fr));
              gap: var(--s6) var(--s5); align-items: start; }
  .spec-cell, .spec-cell.narrow, .spec-cell.wide, .spec-cell.pair { width: auto; }
  .spec-stage .kb-card, .spec-stage .kb-slot { width: 148px; }
  .spec-stage .side-item { width: 206px; }
  /* Поле 4 px по горизонтали заводилось ради теней «поднятой» и кольца
     фокуса — а сдвигало ТЕЛО на 3–5 px вправо от собственной подписи: ровно
     та лесенка, которую нельзя объяснить, но видно. Тени и кольцо и так
     рисуются за границей блока; поле осталось только вертикальным. */
  .spec-stage { padding: 6px 0; }
  .spec-lab { font-size: 11px; color: var(--t-tertiary); margin-top: var(--s3); line-height: 1.45; }
  .spec-lab b { color: var(--t-primary); font-weight: 600; display: block; margin-bottom: 2px; }

  .kb-card.hov { background: #24242A; box-shadow: inset 0 1px 0 rgba(255,255,255,0.09); }
  .kb-card.foc { box-shadow: 0 0 0 2px rgba(47,92,255,0.95), 0 0 0 5px rgba(47,92,255,0.20); }
  .kb-card.drag { background: #2A2A31; transform: rotate(-1.6deg);
                  box-shadow: 0 18px 40px rgba(0,0,0,0.72), inset 0 1px 0 rgba(255,255,255,0.11); }
  .kb-slot { height: 96px; border-radius: var(--r-l); background: rgba(0,0,0,0.26);
             box-shadow: inset 0 2px 4px rgba(0,0,0,0.55), inset 0 -1px 0 rgba(255,255,255,0.055); }

  /* 61. Лист состояний показывал пульты НЕ ТЕМИ, что стоят на экране, причём
     двумя способами сразу. Заливки: наведение на пункт сайдбара он красил
     0.035, на значок рейла — 0.055, тогда как живой пульт красит оба 0.05,
     — три числа на одно состояние, и ни одно нельзя проверить глазом.
     Раскладка: правило колонки висело на `.rail .rl`, а предка `.rail` на
     листе нет, и значок рейла вставал строкой «слово справа от знака»
     шириной 32 вместо колонки 60 — лист документировал объект, снятый
     с экрана. Спека, показывающая элемент не таким, каков он в деле, — та
     же рукописная калька, что и число, написанное рукой: расходится молча
     и врёт первой. Поэтому у листа больше нет СВОИХ значений состояний
     вовсе: он берёт их оттуда же, откуда экран, и разойтись физически
     нечему. */

  .spec .btn.hov.primary { background: #4570FF; }
  .spec .btn.act.primary { background: #2145C4; }
  .spec .btn.foc.primary { box-shadow: 0 0 0 3px rgba(47,92,255,0.34); }
  .spec .btn.hov.secondary { border-color: rgba(255,255,255,0.26); color: var(--t-primary); }
  .spec .btn.dis { opacity: .34; }
  .spec .btn-set { display: flex; gap: var(--s3); align-items: center; }
  .spec-note { font-size: 12px; color: var(--t-secondary); line-height: 1.55; margin-top: var(--s5);
               max-width: 78ch; }
  .spec-note b { color: rgba(255,255,255,0.9); font-weight: 600; }

  /* Поле ввода — углубление на СВОЕЙ плите, а не провал ниже базы окна.
     Было --bg-base (#05030D): поле оказывалось темнее фона всего окна и
     возвращало хрому базы на самую высокую поверхность. */
  .comment-field { background: #17171B; border: none;
                   box-shadow: inset 0 1px 3px rgba(0,0,0,0.45), inset 0 -1px 0 rgba(255,255,255,0.05); }

  /* Кегли приведены к таблице 04-typography 3.2: ниже 10 px не опускаемся,
     капс-лейблы — 11/13 с разрядкой 6 %, а не 10 с 8 %. */
  .kb-col-head .kbart { font-size: 10px; }
  .step .lbl { font-size: 10px; }
  .artifact h4 { font-size: 16px; }
  /* Длина строки: 78ch по глифу «0» давало 95 знаков кириллицей. */
  .spec-note { max-width: 34em; line-height: 1.45; }
  .overlay-insp .artifact p, .overlay-insp .artifact li { line-height: 1.45; }
  .spec-lab { line-height: 1.4; }
  /* Столбик счётчиков: плашка утапливала цифру паддингом и ломала правую кромку. */
  .side-item .count.pill { margin-right: -7px; }

  /* ═══ РЕВИЗИЯ ПО ШЕСТИ РЕВЬЮ ═══════════════════════════════════════════ */

  /* 1. Поверхности. Было семь ступеней над базой, две из них неразличимы
        (ΔL* 0.44), а «принятая» карточка оказалась СВЕТЛЕЕ обычной. Канон
        09-surfaces требует ровно четыре слоя и монотонный рост. Шаг ≈5 L*. */
  :root { --b-default: rgba(255,255,255,0.24); --b-strong: rgba(255,255,255,0.38); }
  .pane, .rail, .pane.sidebar, .pane.list { background: var(--bg-surface); }
  .kb-card, .kb-col.done .kb-card { background: var(--bg-raised); box-shadow: none; }
  /* Тост стоял на #2A2A31 — а это не ступень поверхности, а ПОДЪЁМ карточки
     под курсором (L* 17.3). Ступеней над базой ровно четыре, и «поверх всего»
     — одна из них: инспектор и тост живут на одной, друг над другом
     не бывают. Иначе на экране пять уровней при трёх разрешённых. */
  .toast { background: var(--bg-overlay); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12); }

  /* 2. Плиты и сетка. Поле канваса было 24 при зазоре плит 8 — внутреннее
        втрое больше внешнего, и три плиты читались одной разрезанной
        поверхностью. Колонки были fixed 148 и сходились по ширине случайно. */
  .win { padding: 0 var(--s5) var(--s5); }
  .two, .two.short { gap: var(--s4); grid-template-columns: 56px 222px minmax(0,1fr); }
  .rail { padding: var(--s4) 0; }
  .pane.sidebar { padding-top: var(--s4); }
  /* Флаг канваса — 16 от кромки плиты: на нём стоят вкладки, строка среза,
     шапки колонок и КРОМКИ карточек. Заголовок внутри карточки отступает
     ещё на 8 — это вложенность, а не третья вертикаль: он живёт в своей
     коробке. Пробовали ровнять буквы по буквам (вкладки и шапки на 24, как
     заголовки карточек) — тогда девять кромок карточек оставались единственной
     линией на 16 и спорили со всем остальным. */
  .pipe-bar { padding: var(--s4) var(--s4) 0; gap: var(--s5); }
  .board { display: grid; grid-template-columns: repeat(9, minmax(0,1fr));
           gap: var(--s4); padding: var(--s5) var(--s4) var(--s4); align-items: start; }
  .kb-col { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; flex: none; }
  .kb-card > * { min-width: 0; max-width: 100%; }
  .kb-stack { display: flex; flex-direction: column; gap: var(--s3); }

  /* 3. Карточка. Поле внутри — 8, зазор между карточками — 12, между
        колонками — 16, шов перед «Готово» — 52. Стояло 12 = 12 = 12, и поле
        карточки равнялось рву вокруг неё: доска читалась однородной сеткой,
        а не набором объектов. Одна левая ось: шапка колонки, чип и сноска
        встают на тот же отступ, что и заголовок. */
  .kb-card { padding: var(--s2); gap: var(--s1); height: 126px; border-radius: var(--r-l); }
  .kb-col-head, .fold-note { padding: 0 var(--s2); }
  .kb-col-head { height: 46px; display: flex; flex-direction: column; justify-content: flex-start; }
  .kbrow { display: flex; align-items: baseline; gap: var(--s2); }
  .kb-col-head .kbt { font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
                      text-transform: uppercase; color: var(--t-tertiary); }
  .kb-col.done .kbt { color: var(--t-tertiary); opacity: 1; }
  /* Якорь, переживающий прищур: в размытом кадре не было видно профиля доски. */
  .kbn { margin-left: auto; font-size: 17px; font-weight: 600; line-height: 1;
         color: var(--t-primary); font-variant-numeric: tabular-nums; }
  .kbsub { height: 20px; margin-top: 5px; display: flex; align-items: center; }
  .kc-title { font-size: 13px; line-height: 17px; }
  .kc-branch { display: block; font-family: var(--font-mono); font-size: 11px;
               color: rgba(255,255,255,0.50); overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .kb-card .kc-foot { margin-top: auto; height: 20px; display: flex; align-items: center;
             justify-content: flex-start; padding: 0; }

  /* 4. Чипы. Было три механики сразу (тёмный текст по светлому, белый по
        тёмному, цветной текст без заливки), «в работе» и «выбрано» отличались
        по тону на 9.8°, а «в работе» и «упало» в ч/б были одним пикселем.
        Теперь одна механика, разведённые светлоты (L* 81/70/61) и знак внутри. */
  .st, .kc-art.live { display: inline-flex; align-items: center; gap: 5px;
        padding: 3px var(--s2); border-radius: 999px; font-size: 11px; font-weight: 600;
        line-height: 14px; white-space: nowrap; max-width: 100%; overflow: hidden; }
  .st .ic-x { width: 11px; height: 11px; flex: none; fill: none; stroke: currentColor;
              stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .st.warn { background: #FBBF24; color: #17130A; }
  .st.live { background: #2E2E36; color: #C9C9CC; }
  .st.err  { background: #FF8A73; color: #2B0C05; }
  .st.done { background: var(--bg-overlay); color: #9A9AA0; }
  .st.mute { background: var(--bg-overlay); color: #9A9AA0; }
  .st.live .dot { width: 5px; height: 5px; border-radius: 999px;
                  background: currentColor; opacity: .8; flex: none; }
  .kb-call { min-width: 0; padding: 2px 7px; font-size: 10px; line-height: 13px; }

  /* 5. Состояния. Замер показал, что выбор был СЛАБЕЕ наведения: светлоту
        тянул один синий канал, в ч/б выбор читался как слабый ховер.
        Разрыв задан конечной светлотой, а не альфой, и одинаков у всех. */
  .kb-card:hover, .kb-card.hov { background: #2A2A31;
                                 box-shadow: inset 0 1px 0 rgba(255,255,255,0.09); }
  .kb-card.sel { background: #2A2E3E; box-shadow: inset 0 0 0 2px #2F5CFF; }
  .side-item:hover, .side-item.hov, .rl:hover, .rl.hov { background: rgba(255,255,255,0.05); }
  .side-item.sel, .rl.sel { background: rgba(255,255,255,0.13); }
  .side-item.sel .ic, .rl.sel .ic { color: var(--t-primary); }
  /* Канон 08-controls 7.3: кольцо 2 px на полной непрозрачности с офсетом 2 px,
     а не свечение. Внутренний слой цветом плиты даёт офсет на любом фоне. */
  .kb-card.foc, .spec .btn.foc.primary { box-shadow: 0 0 0 2px var(--bg-surface), 0 0 0 4px #2F5CFF; }
  .kb-card.drag { background: #33333A; transform: rotate(-1.6deg);
                  box-shadow: 0 18px 40px rgba(0,0,0,0.72), inset 0 1px 0 rgba(255,255,255,0.11); }
  .kb-slot { border: none; height: 126px; background: rgba(0,0,0,0.34);
             box-shadow: inset 0 3px 6px rgba(0,0,0,0.75), inset 0 -1px 0 rgba(255,255,255,0.09); }

  /* 6. Сайдбар. Счётчики стояли на двух правых осях и красились в цвет —
        то есть цвет приходил текстом вопреки собственному закону. */
  .side-item { color: var(--t-secondary); border-radius: var(--r-m); }
  .side-item.bare { padding-left: var(--s3); }
  .side-item .count, .side-item .count.warn, .side-item .count.err {
        font-size: 12px; color: var(--t-tertiary); font-variant-numeric: tabular-nums;
        background: none; padding: 0; margin: 0; border-radius: 0; }
  .side-item.sel .count { color: var(--t-primary); }
  .side-cap { font-size: 11px; letter-spacing: 0.06em; color: var(--t-tertiary);
              padding: 0 var(--s3) var(--s2); }

  /* 7. Рейл. Бейдж стоял в 2 px от ЧУЖОЙ плитки и в 6 px от своего глифа —
        по закону близости он принадлежал соседу. Возвращён в габарит. */
  .rl-b { top: 2px; right: 2px; box-shadow: 0 0 0 1.5px var(--bg-surface);
          background: rgba(255,255,255,0.20); color: var(--t-primary); }
  .rl-b.warn { background: #FBBF24; color: #17130A; }
  .tb-btn.icon { height: 28px; width: 28px; }

  /* 8. Вкладки пайплайнов. «Инцидент 0» — кликабельный фильтр, а не disabled:
        opacity 0.45 давала 2.05:1. Ноль спрятали, хотя он просто ноль. */
  .pipe-tab.empty { opacity: 1; }
  .pipe-tab.empty .pipe-name { color: var(--t-disabled); }

  /* 9. Инспектор. Артефакт упирался в панель действий на 5 px при внутренних
        просветах 8–17 — внешнее меньше внутреннего. */
  .overlay-insp { top: var(--s4); bottom: var(--s4); right: var(--s4); width: 424px;
                  background: var(--bg-overlay); padding: var(--s4);
                  box-shadow: 0 24px 64px rgba(0,0,0,0.62), inset 0 1px 0 rgba(255,255,255,0.08); }
  .insp-name { font-size: 16px; font-weight: 600; color: var(--t-primary); }
  .insp-head .sub .mono { font-family: var(--font-mono); font-size: 11px; color: var(--t-tertiary); }
  .insp-where { margin-top: var(--s2); font-size: 12px; color: var(--t-secondary); }
  .overlay-insp .artifact { padding-bottom: 0;
        mask-image: linear-gradient(to bottom, #000 calc(100% - 40px), transparent); }
  .actionbar { padding-top: var(--s4); }
  .insp-more { display: inline-flex; align-items: center; height: 26px; padding: 0 10px;
               margin-bottom: var(--s3); font-size: 12px; color: var(--t-secondary);
               border: 1px solid var(--b-default); border-radius: var(--r-m); }
  .btn.secondary { border: 1px solid var(--b-strong); color: var(--t-secondary); background: none; }
  .comment-field { background: #17171B; border: none;
                   box-shadow: inset 0 1px 3px rgba(0,0,0,0.45), inset 0 -1px 0 rgba(255,255,255,0.05); }
  /* Скрим обесцвечивал доску (saturate 0.7) и превращал янтарь в оливу —
     ровно ту грязь, ради которой всё и переделывалось. */
  .board-scrim { background: rgba(0,0,0,0.55); backdrop-filter: none; }

  /* 10. Деградация. opacity на карточке роняла ВЕСЬ текст ниже AA (3.2:1),
         а исключение для красного не работало: opacity родителя создаёт группу.
         Снимок кодируется обесцвечиванием чипов, читаемость не трогаем.
         Янтарь снят: недоступное ядро и оборванный стрим — одна поломка. */
  .win:not(.ovl) .degrade ~ .board .kb-card { opacity: 1; }
  .degrade { margin: var(--s4) var(--s4) 0; padding: var(--s3) var(--s4);
             border-radius: var(--r-l); background: var(--bg-raised); box-shadow: none;
             display: flex; align-items: center; gap: var(--s3); }
  .degrade .dg-ic { color: var(--t-secondary); display: flex; }
  .degrade .dg-tx { flex: 1; font-size: 12px; color: var(--t-primary); line-height: 1.45; }

  /* 11. Переполнение. Сорок первая карточка исчезала под overflow: hidden
         без единого знака, что она есть. */
  .kb-col.scrolls .kb-stack { max-height: 508px; overflow: hidden;
        mask-image: linear-gradient(to bottom, #000 calc(100% - 64px), transparent); }
  .kb-empty { font-size: 12px; color: var(--t-tertiary); padding: 2px var(--s3);
              line-height: 1.45; }
  .fold-note { font-size: 11px; color: var(--t-tertiary); }

  /* 12. Лист состояний обязан быть калькой экрана, а не его копией. */
  .spec-stage .kb-card, .spec-stage .kb-slot { width: 148px; }
  .spec-stage .side-item { width: 198px; }
  .spec-row.four .spec-set { grid-template-columns: repeat(4, 1fr); }

  /* ── ревизия седьмая: то, что поймал разбор по элементам ────────────────── */

  /* 13. Шапка колонки стояла на 12 px правее кромки карточек — третья
         вертикаль в канвасе на ровном месте. Теперь колонка — один флаг:
         заголовок, счётчик и кромки карточек на одной линии. */
  .kb-col-head, .fold-note { padding: 0; }
  .kb-col-head { height: 24px; justify-content: center; }  /* высота снята ревизией 39 */
  /* 13-бис. Счётчик стоял прижатым вправо, и до заголовка СОСЕДНЕЙ колонки ему
         было 12 px, а до своего собственного — под сотню. Ряд чисел читался
         красиво и группировал неверно. Тогда число вернули вплотную к слову —
         СНЯТО ревизией 39: вплотную справа числа встают лесенкой и не
         сравниваются. Верное место — под словом. */
  .kb-col-head .kbrow { display: flex; align-items: baseline; gap: var(--s2); }
  .kb-col-head .kbn { margin-left: 0; font-size: 12px; font-weight: 600;
                      color: var(--t-tertiary); }

  /* 14. Подпись «3 ждут вас» под счётчиком «3» — то же число дважды подряд,
         а чипы «ваш ход» на самих карточках говорят это же в третий раз.
         Снято целиком: колонка короткая, звать не нужно. */
  .kbsub, .kb-call { display: none; }

  /* 15. Ветка «плавала» по вертикали вслед за длиной заголовка, и ряд
         карточек терял вторую горизонталь. Низ карточки — единый блок:
         заголовок сверху, ветка и чип — прижатой парой. Три рельса
         проходят сквозь весь ряд. */
  /* align-items: center достался от макета, где .kc-meta была строкой; после
     разворота в столбец он стал центрировать чип ПО ГОРИЗОНТАЛИ — при флаговом
     заголовке. Замер ловил это безошибочно: поле слева у чипа было равно полю
     справа на всех двадцати карточках кадра, а левый край чипа прыгал по
     колонке на 11–23 px. Колонку читают вертикально — вертикаль и была съедена. */
  .kb-card .kc-meta { margin-top: auto; display: flex; flex-direction: column;
             align-items: flex-start; gap: 6px; min-width: 0; max-width: 100%; }
  .kc-meta > * { min-width: 0; max-width: 100%; }
  .kb-card .kc-meta .kc-foot { margin-top: 0; }

  /* 16. Тост. Три ошибки в одном элементе:
         жирное шло моноширинным (в макете так набирали имя ветки, а тут
         заголовок change'а — русская проза); галка светилась зелёным, заводя
         на доску пятый цвет ради рядового подтверждения; «Отменить» несла
         разом и бордер, и цветную подпись — двойное кодирование, тогда как
         по всему экрану покой без бордера, а различение — ховером. */
  .toast .tx b { font-family: inherit; font-size: 13px; }
  .toast .ic { color: var(--t-secondary); }
  .toast .undo { border: none; padding: 4px var(--s2); border-radius: var(--r-m);
                 color: var(--t-accent); font-weight: 500; }
  .toast .undo:hover, .toast .undo.hov { background: rgba(255,255,255,0.07); }

  /* 18. Значок вида на карточке дублировал префикс ветки (feat/, docs/,
         refactor/), который виден всегда, и при этом отъедал 18 px у
         заголовка в дорожке шириной 112 px — «Инспектор по требованию»
         срезало на последней букве. Снят: тип называет ветка, а карточка
         получила ровный внутренний флаг из трёх строк. */
  .kc-top .kc-pict { display: none; }

  /* 19. Чип мог перерасти карточку и обрезаться посреди слова: у флекс-
         элемента min-width по умолчанию auto, и max-width: 100% не срабатывал.
         Страховка на случай длинной подписи — многоточие, а не срез. */
  .kc-foot .st { min-width: 0; }
  .st .st-tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 17. В сайдбаре было две левых вертикали: срез без значков, проекты со
         значками. Значок проекта дублировал имя и ничего не различал —
         снят, все строки панели встали на один флаг. */
  .side-item .ico { display: none; }

  /* 20. Пайплайны разной длины — это факт модели, а не край вёрстки: 3 стадии
         у хотфикса, 8 у фичи, 10 у фичи на много сервисов. Колонки перестали
         быть жёсткой девяткой: сколько стадий, столько дорожек. Ниже 120 px
         дорожка не сжимается — вместо каши доска едет вбок. */
  /* Дорожка — константа 128 на любом пайплайне: тот же change обязан быть
     того же размера и на трёх стадиях, и на десяти. Короткий пайплайн не
     растягивает карточки, а оставляет канвас пустым справа; длинный едет вбок.
     Само число подставляет сборка. */
  .board { grid-template-columns: none; grid-auto-flow: column;
           justify-content: start; }
  .board.scrollx { overflow-x: hidden; }

  /* 21. Увеличенный разрыв перед «Готово» ПРОБОВАЛИ и сняли: отступ живёт
         внутри дорожки грида, поэтому съедал ширину её же карточек — колонка
         исхода оказывалась на 16 px уже всех прочих, и подпись «принят 28 июля»
         уходила в многоточие только в ней. Равенство дорожек дороже разрыва:
         что «Готово» — не стадия, говорят её имя, серые чипы и «+N раньше». */
  .pane.list.short .board { padding-bottom: var(--s5); }
  .pipe-pair { display: flex; flex-direction: column; gap: var(--s6); }
  .pipe-case-cap { font-size: 12px; color: var(--t-tertiary); margin-bottom: var(--s3);
                   margin-left: calc(var(--s4) + 1px); letter-spacing: 0.01em; }

  /* 22. Состояния, которых на листе не было вовсе, а в жизни они первыми и
         случаются: нажатие, ожидание после клика, ошибка ввода, зона, куда
         нельзя, и «пока вы смотрели в другое место, агент это подвинул».
         Порядок силы: нажатие < наведение < выбор < фокус < поднятая. */
  .kb-card.act  { background: #191920; box-shadow: none; }
  /* У плоского пункта в покое заливки нет, поэтому «гаснет» ему нечем:
     нажатие уводит его НИЖЕ плиты, а не выше. */
  .side-item.act, .rl.act { background: rgba(0,0,0,0.28); }
  .kb-card.fresh { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.30); }
  .drag-no { position: relative; display: inline-block; }
  .no-badge { position: absolute; right: -8px; bottom: -8px; width: 24px; height: 24px;
              border-radius: 999px; background: #FF8A73; color: #2B0C05;
              display: flex; align-items: center; justify-content: center;
              box-shadow: 0 0 0 3px var(--bg-surface); }
  .no-badge .ic { width: 14px; height: 14px; }

  .btn.load { position: relative; opacity: 1; pointer-events: none;
              display: inline-flex; align-items: center; gap: 7px; }
  /* Кадр обязан быть один и тот же при каждой сборке. Крутилка кнопки —
     единственная живая анимация на листе, и она отдавала свою фазу по
     таймеру: две сборки подряд БЕЗ ЕДИНОЙ ПРАВКИ расходились на 122 пикселя
     ровно в её квадрате 14×14. Пиксельное сравнение «до и после» — главный
     способ доказать, что правка ничего не сдвинула; пока в кадре есть шум,
     доказывать нечем. Пауза с отрицательной задержкой останавливает
     анимацию НА ЗАДАННОЙ фазе, а не на нулевой: крутилка нарисована
     повёрнутой (видно, что это крутилка), но всегда одинаково. Живой
     анимации это не касается — правило живёт в слое листа, не в продукте. */
  .btn.load .spin { animation-play-state: paused; animation-delay: -0.245s; }
  .btn.load .spin { width: 12px; height: 12px; border-radius: 999px; flex: none;
              border: 2px solid rgba(255,255,255,0.30); border-top-color: #FFF; }
  .btn.primary.dis { background: #23232A; color: var(--t-disabled); box-shadow: none; }

  .comment-field.foc { box-shadow: inset 0 1px 3px rgba(0,0,0,0.45),
                       0 0 0 2px var(--bg-surface), 0 0 0 4px #2F5CFF; color: var(--t-primary); }
  .comment-field.err { box-shadow: inset 0 1px 3px rgba(0,0,0,0.45),
                       inset 0 0 0 1.5px #FF8A73; }
  .comment-field .caret { display: inline-block; width: 1.5px; height: 14px;
                       background: #FFF; margin-left: 1px; vertical-align: -2px; }
  .field-err { margin-top: 6px; font-size: 11px; line-height: 1.45; color: #FFB3A3; }

  /* 23. Скрим гасил только плиту: у карточки своё position: relative, и она
         оставалась поверх. Доска от этого читалась не тише, а КОНТРАСТНЕЕ, чем
         без инспектора, — обещание «доска уходит на второй план» на рендере
         не подтверждалось. Скрим встаёт выше карточек, а выбранная поднимается
         над скримом: якорь обязан остаться там, где на него смотрел глаз. */
  .board-scrim { z-index: 5; }
  .overlay-insp { z-index: 7; }
  .win.ovl .kb-card.sel { z-index: 6; }

  /* 24. «Читать design.md целиком» выглядело ровно как поле комментария под
         ним: одна форма на действие и на ввод. Ссылка перестала притворяться
         полем. */
  .insp-more { height: auto; padding: 0; background: none; box-shadow: none;
               border: none; color: var(--t-accent); font-size: 12px; }

  /* 25. Ультрамарин зарезервирован за действием, а моноширинные вставки внутри
         артефакта им подсвечивались — цвет действия на неткликаемом. */
  /* 50. Инлайновая плашка кода отрывала следующий знак препинания от фразы:
     её правое поле давало 9 px до точки с запятой при межсловном пробеле
     в 5 px — точка с запятой оказывалась приклеена к следующему слову,
     а не к своему. Плашка снята целиком: моноширинного начертания хватает,
     чтобы отличить значение от прозы, а заливка на 6 % — та самая мутная
     подкраска большой площадью, которую канон запрещает. */
  .artifact code { color: var(--t-secondary); background: none; padding: 0; }

  /* 26. Артефакт обещал «показаны первые 10» и обрывался пустотой. Обрыв
         затуханием говорит, что текст продолжается. */
  .overlay-insp .artifact { mask-image: linear-gradient(to bottom, #000 calc(100% - 44px), transparent); }

  /* 27. В переполненной колонке карточки сжимались флексом до одной строки:
         сорок «карточек» высотой 36 px с одним заголовком — это уже не тот
         объект, чью верстку кадр проверяет. Высота карточки неприкосновенна,
         лишнее уезжает под затухание. */
  .kb-stack { display: flex; flex-direction: column; gap: var(--s3); }
  .kb-stack .kb-card { flex: none; }

  /* 28. Ноль — такой же экстремум данных, как сорок. Пустая доска не молчит
         и не извиняется: она называет, что здесь будет, и даёт первый шаг.
         Пустые колонки при этом остаются на месте — человек должен видеть,
         куда именно встанет первая карточка. */
  /* Блок стоял по центру и центрованным текстом — ёлочка с огрызком
     в 94 px в последней строке, в продукте, где всё остальное флаговое.
     Хуже: снизу поле было задано несуществующей переменной --s7, то есть
     нулём, — блок не центрировался, а свисал (251 px сверху, 38 снизу).
     Теперь блок стоит на левом флаге доски, ровно над колонкой Questions,
     про которую сам же и говорит, и центрирован в свободной зоне честно. */
  .board.nogrow { flex: none; }
  .board-none { flex: 1; display: flex; flex-direction: column; align-items: flex-start;
                justify-content: center; gap: var(--s3);
                padding: var(--s6) var(--s5) var(--s6) var(--s4);
                text-align: left; }
  .bn-t { font-size: 16px; font-weight: 600; color: var(--t-primary); }
  .bn-s { font-size: 12px; line-height: 1.5; color: var(--t-tertiary); max-width: 42ch; }
  .board-none .btn { margin-top: var(--s2); }
  /* ревизия восьмая — 29. Шов перед «Готово» отдельной дорожкой грида.
     Дорожки заданы явным списком, поэтому auto-flow возвращается к строке:
     колонки раскладываются по шаблону слева направо, а пустая <i class="kb-gap">
     занимает узкую дорожку между PR и корзиной. Ширина карточки при этом
     остаётся ровно той же, что и в стадиях. */
  .board.tmpl { grid-auto-flow: row; justify-content: start; }
  .kb-gap { display: block; }
  /* 30. В снимке гаснет ровно то, что устарело. Янтарь и коралл остаются
     в полную силу: «ждёт вас» и «встало» — правда и на снимке, и она же
     стоит в срезе числом. Гаснут карточки, чей чип сменился на «нет связи». */
  .win:not(.ovl) .degrade ~ .board .kb-card .st.warn { opacity: 1; }
  /* 31. Знак в плашке отказа — коралловый. Это единственное цветное пятно
     во всю ширину строки, и оно того же цвета, что «встало» на карточке:
     ядро не отвечает — это то же «встало», только сразу для всей доски.
     Заливать коралловым саму плашку нельзя: альфа на большой площади мутит
     фон, цвет приходит малым сплошным пятном. */
  .degrade .dg-ic { color: #FF8A73; }
  /* 32. На листе состояний карточка ровно той ширины, что и на доске.
     Число приходит от генератора из той же константы, что дорожка: рукой
     здесь стояло 132 при дорожке 127 — спека, показывающая элемент шире,
     чем он бывает, врёт о переносах заголовка, а ломалось всё на них. */
  /* 33. Недоступная кнопка не отвечает на курсор — иначе подпись «ничего
     не происходит» врёт прямо под картинкой, где что-то происходит.
     Правило наведения было записано позже правила недоступности и потому
     побеждало по каскаду; недоступность обязана быть сильнее. */
  .spec .btn.primary.dis.hov, .btn.primary.dis:hover { background: #23232A; }
  .spec .btn.secondary.dis.hov, .btn.secondary.dis:hover { border-color: rgba(255,255,255,0.12); }
  /* 34. Колонка с прокруткой гаснет книзу. Ровный срез посреди карточки
     читается как дефект отрисовки, а не как «ниже есть ещё»; тот же приём
     уже стоит на доске, которая едет вбок, — одно правило на оба края. */
  .kb-col.scrolls .kb-stack { mask-image: linear-gradient(to bottom, #000 calc(100% - 44px), transparent); }
  /* 35. Одна левая линия на всю панель. Заголовок «Канбан» стоял на восьми
     пикселях отступа, а подписи групп и строки списка — на двенадцати:
     на рендере это четыре пикселя расхождения, то есть флага не было. */
  .side-head { padding-left: var(--s3); }
  /* 36. Строка применённого среза. Встаёт на общую левую линию панели,
     доски и вкладок: она говорит про содержимое колонок. Ссылка выхода —
     ультрамарином, потому что это действие; кнопкой она спорила бы
     с «Новым change», а возврат к полной доске — не соседний по важности ход. */
  .slice-note { padding: var(--s4) var(--s4) 0; font-size: 12px; line-height: 18px;
                color: var(--t-tertiary); display: flex; align-items: baseline; gap: var(--s3); }
  .slice-note b { color: var(--t-secondary); font-weight: 600; }
  .sn-act { color: var(--t-accent); cursor: pointer; }
  .slice-note + .board { padding-top: var(--s4); }
  /* 37. Создание названо словом. Плюс в титлбаре был единственным местом,
     где главное действие экрана не имело имени: на пустой доске та же кнопка
     подписана «Новый change». Сочетание осталось в подсказке — печатать его
     в хроме рядом с одним действием значит спорить с меню. */
  .tb-btn.named { display: inline-flex; align-items: center; gap: 6px;
                  padding: 0 10px 0 8px; height: 24px; border-radius: 7px;
                  font-size: 12px; color: var(--t-secondary); }
  .tb-btn.named .ic { width: 13px; height: 13px; }
  .tb-btn.named:hover, .tb-btn.named.hov { background: #1C1C21; color: var(--t-primary); }
  /* 38. Карточка ростом по содержимому. Высота стояла жёсткой (126 px) ради
     того, чтобы ряды шли сквозь колонки, — но ряды на канбане ничего не
     значат: вторая карточка Questions и вторая карточка PR не связаны ничем.
     Выравнивание оказалось ради выравнивания, а платой была дыра ВНУТРИ
     карточки больше, чем зазор МЕЖДУ карточками, — прямое нарушение
     «внутреннее меньше внешнего». */
  .kb-card { height: auto; }
  .kb-card .kc-meta { margin-top: 0; }
  .kb-slot { height: 72px; }
  /* 39. Счётчик колонки встал ПОД подпись. Он стоял вплотную к слову справа,
     и девять счётчиков вставали лесенкой по длине подписей — сравнить их
     взглядом было нельзя, хотя сравнивать их и есть работа шапки. Прижать
     их к правому краю дорожки не вышло: число оказывалось в 12 px от чужого
     слова и в 40 от своего и честно читалось как «3 RESEARCH». Под словом
     выполняются оба закона: числа стоят на одной левой линии и на одной
     высоте — то есть сравнимы, — и каждое остаётся при своей подписи. */
  .kb-col-head .kbrow { flex-direction: column; align-items: flex-start; gap: 1px; }
  .kb-col-head .kbn { margin-left: 0; font-size: 13px; color: var(--t-secondary); }
  .kb-col-head { height: auto; padding-bottom: 3px; }
  /* 40. Невыбранная вкладка называет свою работу числом, а цветом — чей там
     ход. Иначе инцидент, вставший за вкладкой, экрану сказать нечем: доска
     показывает один пайплайн, а счётчик проекта считает все, и разницу
     между 18 и 22 читателю было не на чем закрыть. Чип — той же породы,
     что на карточках: язык цвета один на весь экран. */
  .pipe-tab .pipe-n {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    font-size: 11px; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums; }
  /* 59. Цвет с вкладки СНЯТ. Число на вкладке — размер набора, а цвет на
     этом экране кодирует состояние одного change’а. Крашеная цветом худшего
     члена, вкладка заводила вторую шкалу теми же красками: рядом со срезом
     «Ваш ход 5» стояло «Баг 3» янтарём, и 5 + 3 + 1 читалось как девять
     ваших ходов — величина, которой нет. Заодно сошёлся прищур: янтарных
     пятен на размытом кадре снова ровно столько, сколько янтарных чипов.
     Чем платим: «горит в соседнем пайплайне» экран сказать больше не умеет.
     Это честнее, чем говорить это враньём, и записано в долг. */
  .pipe-n { background: rgba(255,255,255,0.08); color: var(--t-secondary); }
  /* Выбранная вкладка тоже носит число — иначе сумма на экране не сходится, —
     но цвета не получает: её содержимое и так на доске, а цвет обязан значить
     «там, куда вы не смотрите, ваш ход». */

  /* 48. Доска, едущая вбок, обрывается затуханием: ровный срез по кромке плиты
     читается как конец доски, а не как «дальше есть ещё».
     49. «Готово» ПРИБИТО К ПРАВОМУ КРАЮ. На десятистадийном пайплайне корзина
     уезжала за кадр целиком — ни шапки, ни счётчика, ни следа, — то есть
     колонка исхода пропадала на одном пайплайне из пяти и запомнить её рукой
     было нельзя. Теперь едут только стадии, а корзина стоит там же, где на
     любой другой доске; затухание переехало на её левую кромку и говорит
     ровно то, что нужно, — «между PR и „Готово“ спрятаны стадии». */
  .board.scrollx .kb-col.done { position: sticky; right: 0; z-index: 2;
                                align-self: stretch; background: var(--bg-surface); }
  .board.scrollx .kb-col.done::before { content: ''; position: absolute;
                                top: 0; bottom: 0; right: 100%; width: 56px;
                                pointer-events: none;
                                background: linear-gradient(to right, transparent, var(--bg-surface)); }
  /* 41. Рейл с подписями. Пиктограмма без слова работает, когда значений
     два-три и они общеизвестны; здесь их восемь и половина — сущности этого
     продукта («Скиллы», «Ревью»), которые угадать нельзя. Подсказка по
     наведению называет раздел тому, кто уже знает, куда наводить. */
  .two { grid-template-columns: 76px 214px minmax(0,1fr); }
  .rail .rl, .spec .rl { flex-direction: column; gap: 3px; width: 60px;
              height: auto; padding: 7px 0 6px; border-radius: 9px; }
  .rl-tx { font-size: 10px; line-height: 13px; letter-spacing: 0.01em;
           color: var(--t-tertiary); text-align: center; }
  .rail .rl.sel .rl-tx, .spec .rl.sel .rl-tx { color: var(--t-primary); }
  .rail .rl:hover .rl-tx, .spec .rl.hov .rl-tx { color: var(--t-secondary); }
  /* 42. Шапка инспектора: выход и место в очереди. */
  .insp-top { display: flex; align-items: flex-start; gap: var(--s3); }
  .insp-top .insp-name { flex: 1; min-width: 0; }
  .insp-nav { display: flex; align-items: center; gap: 4px; flex: none; }
  /* Место в очереди — такой же факт «где я», как стадия, и набран тем же
     кеглем; тише его делает ступень текста, а не второй кегль. */
  .in-pos { font-size: 12px; color: var(--t-tertiary); }
  .in-b, .in-x { display: inline-flex; align-items: center; justify-content: center;
                 gap: 5px; height: 20px; min-width: 22px; padding: 0 5px; border-radius: 6px;
                 font-size: 11px; color: var(--t-tertiary); background: #1C1C21; }
  .in-b:hover, .in-x:hover { background: #24242A; color: var(--t-secondary); }

  /* 43. Тред вопросов. Вопросы пронумерованы: отвечают на них по одному,
     и номер — единственный способ сослаться на конкретный. */
  .thread .q { display: flex; gap: var(--s3); padding: 0; }
  .thread .q + .q { border-top: none; margin-top: var(--s4); }
  .thread .qn { flex: none; width: 18px; height: 18px; border-radius: 5px;
                background: var(--bg-overlay); color: var(--t-secondary);
                font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  .thread .q p { margin: 0; }
  .q-note { margin-top: var(--s3); padding-top: var(--s3);
            border-top: 1px solid rgba(255,255,255,0.06);
            font-size: 12px; line-height: 18px; color: var(--t-tertiary); }

  /* 44. Разбор вставшего: причина словами, под ней лог, из которого она взята. */
  .artifact h4.second { margin-top: var(--s4); }
  /* 51. Заголовок «Артефакт» стоял ровно посередине между чужим блоком и
     своим: шаги строк 29 / 31 / 29, то есть до заголовка меньше, чем после.
     Заголовок, у которого внутреннее больше внешнего, не собирает под себя
     ничего. Над ним — 24, под ним — 4 до собственного подзаголовка. */
  .overlay-insp .artifact { margin-top: var(--s5); }
  .overlay-insp .artifact h4 { margin-bottom: var(--s1); }
  .overlay-insp .artifact .kv { margin-bottom: var(--s3); }
  .artifact .log { margin: var(--s2) 0 0; padding: var(--s3);
                   background: rgba(0,0,0,0.34); border-radius: 8px;
                   font-family: var(--font-mono); font-size: 11px; line-height: 17px;
                   color: var(--t-tertiary); white-space: pre; overflow-x: auto; }
  /* 45. Окно кадра 27 выше рабочего: инспектор со спросом длиннее доски,
     а обрезанный на середине вопрос — тот же брак, что обрезанный чип. */
  .win.tall .two { min-height: 720px; }
  /* 46. Сочетание клавиш стоит РЯДОМ С ДЕЙСТВИЕМ, а не в подсказке по
     наведению: подсказка называет клавишу тому, кто уже знает, куда наводить. */
  .tb-k { margin-left: 6px; font-family: var(--font-mono); font-size: 10px;
          color: var(--t-tertiary); opacity: 0.85; }
  /* 47. Цена приёмки названа рядом с кнопкой. «Принять» запускает следующую
     стадию — то есть расход, — а отмену до сих пор имело только перетаскивание,
     самое дешёвое и тривиально обратимое действие на экране. */
  .act-cost { font-size: 11px; line-height: 16px; color: var(--t-tertiary);
              margin: var(--s2) 0 var(--s3); }

  /* 52. Длинный комментарий. Поле было строкой-приглашением, то есть кадр
     молча обещал, что длиннее строки не пишут. Поле растёт до предела и
     дальше прокручивается внутри себя; предел не круглый, а осмысленный —
     артефакт, который рецензируют, обязан остаться на экране, поэтому поле
     уступает первым. Затухание идёт по ВЕРХНЕЙ кромке: текст ушёл вверх,
     каретка внизу, и обрыв сверху — единственное, что об этом говорит. */
  .cf-block { display: flex; flex-direction: column; }
  .cf-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px;
             margin-bottom: 6px; font-size: 11px; line-height: 16px;
             color: var(--t-secondary); }
  .cf-head .cf-to { color: var(--t-tertiary); }
  .comment-long { position: relative; height: 156px; overflow: hidden;
                  display: flex; flex-direction: column; justify-content: flex-end;
                  padding: 10px 12px; border-radius: var(--r-m); background: #17171B;
                  font-size: 12px; line-height: 18px; color: var(--t-primary);
                  box-shadow: inset 0 1px 3px rgba(0,0,0,0.45),
                              0 0 0 2px var(--bg-overlay), 0 0 0 4px #2F5CFF; }
  /* Затухание нарисовано слоем, а не маской: маска элемента съедает и его
     кольцо фокуса вместе с ним. Градиент идёт от собственного фона поля —
     цвет известен, подмешивать нечего. */
  .comment-long::before { content: ''; position: absolute; left: 0; right: 0;
                  top: 0; height: 30px; pointer-events: none; z-index: 1;
                  background: linear-gradient(to bottom, #17171B 6px, rgba(23,23,27,0)); }
  .comment-long p { margin: 0; }
  .comment-long p + p { margin-top: 10px; }
  .cf-meta { margin-top: 6px; font-size: 11px; line-height: 16px;
             color: var(--t-tertiary); }
  .cf-meta .cf-draft { display: block; }
  /* Клавиша здесь стояла тегом <b> моноширинным кеглем 10 — четвёртым
     способом набрать клавишу на одном экране. Клавиша не код и не жирное
     слово: она набирается тем же <kbd>, что и всюду. */
  .cf-meta kbd { color: var(--t-secondary); }

  /* 53. Постаревший снимок. «Снимок от 14:22» верно две минуты; через два
     часа сорок минут строка требует посмотреть на часы и вычесть. У снимка
     два числа — когда снят и сколько назад, — и совет тем конкретнее, чем
     дольше молчание: на свежем сбое «Проверить снова» весь разумный ответ,
     на двухчасовом он уже не ответ. */
  .degrade.old { align-items: flex-start; }
  .degrade.old .dg-ic { margin-top: 1px; }
  .degrade.old .btn.secondary { flex: none; margin-top: 1px; }
  /* Не .dg-fix: это имя в базовом макете уже занято рамочным блоком другого
     компонента, и подсказка приезжала с чужой заливкой. Ловушка та же, что
     со специфичностью, только по имени. */
  .dg-hint { display: block; margin-top: 6px; color: var(--t-tertiary); }
  .dg-hint code { font-family: var(--font-mono); font-size: 11px;
                 color: var(--t-secondary); }

  /* 54. Системная настройка «Увеличить контраст». В приложении эти правила
     висят на prefers-contrast: more; в макете — на классе окна, чтобы обе
     настройки было видно рядом с обычным экраном. Кромки возвращаются ровно
     туда, где разделял воздух, а тень уступает сплошной линии: на почти-чёрном
     она и так не разделяет, и здесь это вылезает в полный рост. */
  .win.hc { --t-tertiary: rgba(255,255,255,0.72);
            --t-disabled: rgba(255,255,255,0.56); }
  .win.hc .pane.sidebar, .win.hc .pane.list, .win.hc .rail {
            box-shadow: inset 0 0 0 1px #4E4E58; }
  .win.hc .kb-card { box-shadow: inset 0 0 0 1px #55555F; }
  .win.hc .kb-card.sel { box-shadow: inset 0 0 0 2px #7E9BFF; }
  .win.hc .overlay-insp { box-shadow: inset 0 0 0 1px #7A7A88; }
  .win.hc .side-item.sel, .win.hc .rl.sel { box-shadow: inset 0 0 0 1px #6E6E7C; }
  .win.hc .st.mute, .win.hc .st.done { box-shadow: inset 0 0 0 1px #6A6A76; }
  .win.hc .btn.secondary { border-color: #8A8A98; color: rgba(255,255,255,0.98); }
  .win.hc .comment-field { box-shadow: inset 0 0 0 1px #6E6E7C; }
  .win.hc .insp-more { text-decoration: underline; }
  .win.hc .kb-col-head .kbt { color: rgba(255,255,255,0.72); }
  /* Вся лестница ультрамарина уходит на ступень глубже: белому на нём
     становится 7.74:1 вместо 5.13. Настройка, которая не поднимает худшую
     пару на экране, не выполняет своего единственного обещания. */
  .win.hc .btn.primary { background: #2145C4; }
  .win.hc .st.done .st-tx { color: #C9C9CC; }
  .win.hc .insp-more { color: #A9BEFF; }

  /* 55. Системная настройка «Уменьшить прозрачность». Альфа-заливки под
     текстом становятся сплошными ТОЙ ЖЕ светлоты — светлоту им и подбирали,
     поэтому картинка почти не меняется, и это хороший знак. Настоящая потеря
     одна: скрим становится непрозрачным, и инспектор перестаёт быть слоем
     над доской — он слой над одной карточкой, ради которой открыт.
     Альфа-белый ТЕКСТ полупрозрачностью не считается: он лежит на фоне
     известного цвета и равен сплошному. */
  .win.rt .side-item.sel, .win.rt .rl.sel { background: #212127; }
  .win.rt .kb-col.done .kb-card { background: #202025; }
  .win.rt .artifact .log { background: #101014; }
  .win.rt .q-note { border-top-color: #34343C; }
  .win.rt .board-scrim { background: #05030D; }
  .win.rt .toast .bar { background: #3A3A44; }

  /* 58. Минимальная ширина окна. Ширина не подобрана на глаз, а посчитана
     генератором из тех же констант, которыми живёт доска, и пришла сюда
     числом. Дефицит забирает канвас: он один умеет ехать вбок, ничего
     не теряя. На минимуме инспектор перестаёт быть слоем — оверлей в 424
     на канвасе в 597 закрывает доску целиком, и обещание «карточка остаётся
     видимой» держаться перестаёт. Обещание, которое выполняется через раз,
     хуже, чем не данное: инспектор занимает канвас и становится видом. */
  /* Ширина приходит числом от генератора инлайновым стилем: посчитанное
     число, переписанное рукой в CSS, разойдётся с формулой на первой же
     правке констант. */
  /* 58. На минимуме инспектор перестаёт быть слоем и ЗАНИМАЕТ плиту целиком:
     inset: 0, а не отступ в 16 — иначе вдоль правой кромки остаётся полоска
     доски шириной с поле, и в ней читаются обрубки чужих слов. Слой, который
     закрывает не всё, читается как сломанный, а не как слой. */
  .win.min .overlay-insp { inset: 0; width: auto; border-radius: var(--r-xl); }
  .win.min .board-scrim { display: none; }

  /* 56. Наведение на главной кнопке ОСВЕТЛЯЛО заливку: #2F5CFF → #4570FF,
     и белая подпись на ней падала с 5.13:1 до 4.19:1 — ниже порога. Поймано
     не глазом, а contrast.py: глаз в тот момент как раз доволен, кнопка стала
     ярче. Лестница состояний развёрнута в ОДНУ сторону — вглубь: покой
     5.13, наведение 6.00, нажатие 7.74. Белому от этого только лучше,
     а «поднятость» даёт свет по верхней кромке — тот самый приём, которым
     в этой теме отделяют всё остальное. Гало не участвует: оно занято
     фокусом, и делить один канал между двумя состояниями нельзя. */
  .spec .btn.hov.primary, .btn.primary:hover {
            background: #2A53E8; box-shadow: inset 0 1px 0 rgba(255,255,255,0.22); }
  .spec .btn.act.primary { background: #2145C4; box-shadow: none; }

  /* 57. Подпись ряда на листе состояний стояла на выключенной ступени текста
     (44 %) и давала 4.38:1 — ниже порога для 11 px. Она не выключена,
     она заголовок ряда. */
  .spec-cap { color: var(--t-secondary); }


  /* 60. КЕГЛЬ И ИНТЕРЛИНЬЯЖ — ИЗ ТАБЛИЦЫ КАНОНА, а не из своей стройной
     таблицы рядом. Интерлиньяж жил множителем, и один кегль 11 px получал
     восемь разных значений сразу (11, 14, 15.4, 15.95, 16, 17, 17.05, 18) —
     ни одно из них никто не выбирал, их выбрало наследование. Первая починка
     свела экран к пяти парам (10/13, 11/14, 12/18, 13/18, 16/24) — и это была
     вторая ошибка того же рода: пары придумал я, а таблица есть в каноне
     (04-typography, часть 3.2) и требует буквально «новый размер добавляется
     только через пересмотр таблицы, не на месте». Из тринадцати пар на экране
     в неё попадало шесть.
     Теперь по канону: heading 16/21, body 13/18, caption 11/14, label 11/13
     капсом, mono 12/20, mono-s 10/14. Кегля 12 текстом в каноне нет вовсе,
     а 10 разрешён только необязательным подписям вроде осей графика — разделы
     рейла читают, ради того слова там и появились, поэтому они 11/14.
     Общей сетки базовых линий канон не требует и прямо от неё отказывается
     вслед за Нозиком: «общая базовая сетка для текста 13/18 и кода 12/20
     математически недостижима — и не нужна». Поэтому здесь таблица, а не модуль. */
  /* heading 16/21 */
  .win .insp-name, .win h4, .win .bn-t, .win .second {
    font-size: 16px; line-height: 21px; }
  /* body 13/18 */
  .win .grow, .win .count, .win .win-title, .win .undo, .win .tb-btn,
  .win .kc-title, .win .pipe-name, .win .btn, .win .tx, .win .kbn, .win .kbn-of,
  .win .insp-where, .win .insp-more, .win .comment-field, .win .cf-tx,
  .win .comment-long, .win .dg-tx, .win .dg-hint, .win .spec-note, .win .kb-empty,
  .win .bn-s, .win .q-note, .win .slice-note, .win .sn-act, .win .board-none .btn,
  .win .artifact p, .win .artifact li, .win .thread p {
    font-size: 13px; line-height: 18px; }
  /* caption 11/14 */
  .win .st-tx, .win .st, .win .spec-lab, .win .fold-note, .win .kv, .win .act-cost,
  .win .field-err, .win .qn, .win .cf-head, .win .cf-meta, .win .cf-draft,
  .win .rl-tx, .win .pipe-meta, .win .pipe-n, .win .rl-b, .win .kbt,
  .win .in-b, .win .in-x, .win .tb-k, .win kbd {
    font-size: 11px; line-height: 14px; }
  /* Клавиша — один приём на весь экран. Она стояла тремя способами сразу:
     моно 10 в титлбаре, моно 11 в подсказках, не-моно 11 в шапке инспектора.
     Клавиша не код, поэтому не моноширинная. */
  .win .tb-k, .win kbd, .win .in-b kbd, .win .in-x kbd {
    font-family: inherit; font-weight: 500; letter-spacing: 0; }
  /* label 11/13, капс, разрядка +6% — только там, где НЕТ латиницы. Ряд шапок
     колонок капсом смешивал алфавиты в одной строке: QUESTIONS … ГОТОВО. */
  .win .side-cap { font-size: 11px; line-height: 13px; font-weight: 500;
                   letter-spacing: 0.06em; }
  .win .kbt, .win .spec-cap { text-transform: none; letter-spacing: 0; }
  .win .kbt { font-weight: 500; }
  .win .spec-cap { font-size: 11px; line-height: 14px; font-weight: 600; }
  /* mono 12/20 — блоком. Инлайновая вставка внутри прозы держит интерлиньяж
     прозы: собственные 20 рвали бы строку абзаца, в котором она стоит.
     Это единственное исключение из таблицы, и оно названо в type.py. */
  .win .mono, .win .log, .win .insp-head .sub .mono {
    font-size: 12px; line-height: 20px; }
  .win code { font-size: 12px; line-height: 18px; }
  /* 61. ОДИН УРОВЕНЬ — ОДИН РЫЧАГ (04-typography, часть 7). Принятая карточка
     тише сразу двумя: и цветом, и весом. Канон запрещает складывать рычаги:
     «не делать мельче + серее + светлее одновременно» — перепад получается
     пропастью, а промежуточные уровни заканчиваются. */
  .win .kb-col.done .kb-card .kc-title { font-weight: 600; }

  /* ── ревизия девятая: три критика по конспектам советов бюро ────────────── */

  /* 62. ПОЛЕ КАНВАСА ПЕРЕЕХАЛО НА ПЛИТУ. Оно стояло на каждом ребёнке порознь
     (вкладки 16, доска 16, плашка 16, тост 24) и было РАВНО зазору между
     плитами: 16 и 16. Крайняя колонка отстояла от кромки своей плиты ровно
     так же, как её плита — от соседней, и девять колонок переставали читаться
     группой внутри плиты. Поле поднято до 24 и задано ОДИН раз — самой плитой:
     тогда флаг канваса не «совпадает» у пяти элементов, а физически один.
     Заодно чинится обрез: доска, у которой поле своё, обрезалась по кромке
     ПОЛЯ, и справа от прибитой «Готово» торчали обрубки чужих колонок. */
  .pane.list { padding-left: var(--s5); padding-right: var(--s5); }
  .pipe-bar { padding: var(--s4) 0 0; }
  .board { padding: var(--s5) 0 var(--s4); }
  .pane.list.short .board { padding-bottom: var(--s5); }
  .slice-note { padding: var(--s5) 0 0; }
  .slice-note + .board { padding-top: var(--s3); }
  .degrade { margin: var(--s4) 0 var(--s2); }
  .toast-dock { padding: var(--s6) 0 var(--s5); }
  /* Тост — единственный центрованный объект на экране, где флаг один и он
     назван числом. Центровка строки-якоря законна сама по себе, но здесь она
     спорит с собственным законом кадра. Тост встаёт на флаг канваса. */
  .toast-dock { justify-content: flex-start; }
  /* Строка плашки шла в 120 знаков при интерлиньяже, подобранном для 50:
     на возврате глаз терял строку. Мера — та же, что у прозы инспектора. */
  .degrade .dg-tx { max-width: 74ch; }

  /* 63. ПОЛЕ САЙДБАРА. Плита держит своё поле сама, а строка — своё: текст
     встаёт на 16 от кромки плиты, подложка выбранной строки шире текста на 8.
     Заодно два списка перестали быть одним: счётчик среза стоит ПРИ СВОЁМ
     СЛОВЕ, счётчик проекта — на правой оси. Раньше десять чисел стояли одним
     сквозным столбцом, и глаз сопоставлял «Ничей ход 3» с «crispy-core 9» —
     величины, которые сравнивать не с чем. */
  .pane.sidebar { padding-left: var(--s2); padding-right: var(--s2); }
  .side-item, .side-item.bare { padding-left: var(--s2); padding-right: var(--s2); }
  .side-cap { padding: 0 var(--s2) var(--s2); }
  .side-sec + .side-sec { margin-top: var(--s3); }
  .side-sec:first-child .side-item .grow { flex: none; }
  .side-sec:first-child .side-item .count { margin-left: var(--s2); }

  /* 64. ЧИП БОЛЬШЕ НЕ ВЛЕЗАЕТ В ИНТЕРЛИНЬЯЖ ЗАГОЛОВКА. Зазор «заголовок → чип»
     был 4 при межстрочном просвете 11–12: чип притягивался к последней строке
     сильнее, чем строки заголовка друг к другу, и трёхстрочное имя рассыпалось
     на «две строки и строку с чипом». Проверять это надо на трёхстрочном
     имени, а не на «Нотч-хелпере», — на однострочном дефекта не видно вовсе.
     ПОЛЯ КАРТОЧКИ ОСТАЛИСЬ КВАДРАТНЫМИ 8/8/8/8, и это сознательный отказ.
     Конспект бюро называет одинаковые поля со всех сторон признаком слабой
     вёрстки и приводит примером ровно карточку канбана — но здесь на то же
     число давят два закона сильнее. Первый: любое поле карточки обязано быть
     МЕНЬШЕ зазора между карточками (12), иначе карточка перестаёт читаться
     объектом — это уже ловили ревизией 38. Второй: боковое поле — это мера
     заголовка, а дорожка константа, и каждые 4 px поля снимают со строки
     полслова у объекта, у которого заголовок единственный опознавательный
     знак. Внутри шкалы канона (4 · 8 · 12) свободных значений между 4 и 12
     нет, поэтому все четыре поля пришлись на 8. Противоречие разрешено
     выбором, а не компромиссом, и записано вслух. */
  .kb-card { padding: var(--s2); gap: var(--s3); }

  /* 65. ПОЛЯ ИНСПЕКТОРА. Стояло 32 сверху = 32 слева = 32 справа при 28 снизу:
     вертикали равны горизонталям, и низ МЕНЬШЕ верха — вес содержания не
     скомпенсирован, панель выглядит наклеенной. Стало 28 / 32 / 36.
     И левая кромка встала на кромку дорожки: оверлей резал колонку Implement
     пополам, оставляя 20 px чужой колонки и голый счётчик «3» без подписи. */
  .win .overlay-insp { top: var(--s5); bottom: var(--s5); right: var(--s5);
                       width: 440px; padding: 28px 32px 36px; }
  /* 66. Цена приёмки стояла в 20 px от поля ввода и в 24 от кнопки, которую
     объясняет, — то есть читалась припиской к полю. Разрыв над ней обязан
     быть заметно больше разрыва под ней. */
  .act-cost { margin: var(--s5) 0 var(--s2); }
  /* 67. Два заголовка одного уровня в одной панели собирали контент с разной
     силой: «Артефакт» — 32 сверху и 4 снизу, «Хвост лога» — 16 и 8. */
  .overlay-insp .artifact h4, .overlay-insp .artifact h4.second {
        margin-top: var(--s5); margin-bottom: var(--s1); }
  .overlay-insp .artifact .kv { margin-bottom: var(--s3); }

  /* 68. ПРИБИТАЯ «ГОТОВО» ЛОЖИТСЯ НА ПОДЛОЖКУ ШИРИНОЙ СО ШОВ. Затухание в 56 px
     закрывало чужую колонку лишь на треть: шапки слипались в «INTEГОТОВО», два
     счётчика вставали в 26 px друг от друга и читались парой, которой нет,
     а шов в 52 px, ради которого «Готово» и не читается девятой стадией,
     исчезал на едущей доске вовсе. Теперь под колонкой непрозрачная подложка
     шириной ровно в шов, и только за ней начинается затухание. */
  .board.scrollx .kb-col.done::before { width: 52px; background: var(--bg-surface); }
  .board.scrollx .kb-col.done::after { content: ''; position: absolute;
                                top: 0; bottom: 0; right: calc(100% + 52px); width: 56px;
                                pointer-events: none;
                                background: linear-gradient(to right, transparent, var(--bg-surface)); }
  /* 69. Сноска свёртки отстояла от стопки ровно на зазор между карточками (12)
     и секунду читалась ещё одной карточкой колонки. */
  .fold-note { margin-top: var(--s3); }

  /* 70. ЗАГОЛОВОК ОКНА ВСТАЛ НА ВЕРТИКАЛЬ. Он стоял на 105 при кромке рейла
     101 и кромке сайдбара 117 — то есть промахивался мимо обеих на 4 и 12 px.
     Это худший вид несовпадения: слишком мало, чтобы читаться приёмом, и
     слишком много, чтобы не мешать. Светофор занимает ровно ширину рейла,
     и заголовок встаёт на флаг сайдбара. */
  .titlebar .lights { width: 76px; }
  .titlebar .win-title { margin-left: var(--s4); }
  /* 71. Подпись кадра стояла на 17 = старое поле окна 16 плюс кромка — число
     не пересчитали, когда поле подняли до 24. Считается из той же величины. */
  .pipe-case-cap { margin-left: calc(var(--s5) + 1px); }

  /* 72. Вкладка: имя → счётчик → «8 стадий» стояли с одинаковым шагом 8, и
     два числа оказывались в 8 px друг от друга — «18 8» читалось одной
     величиной или опечаткой. Внутри вкладки шаги разведены: 4 и 16 при 24
     между вкладками. */
  .pipe-tab { gap: var(--s1); }
  .pipe-tab .pipe-meta { margin-left: var(--s3); }
  .pipe-tab.more { opacity: 1; }
  .pipe-tab.more .pipe-name { color: var(--t-tertiary); }

  /* 73. ЛИСТ СОСТОЯНИЙ: ДОРОЖКА = СОСТОЯНИЕ. Сетка обещала сравнение по
     вертикали, а по вертикали стояли разные вещи: «фокус» карточки в пятой
     дорожке, «фокус» кнопки — в четвёртой, и глаз ставил «фокус» против
     «идёт приёмка». Теперь первые пять дорожек — общая лестница (покой,
     наведение, нажат, выбран, фокус), а пустая клетка честно говорит, что
     такого состояния у этого объекта нет. Подписи выровнены по одной линии:
     сцены разной высоты уводили их лесенкой на 48 px.

     Сцена и подпись — ДВЕ строки общей сетки, а не два флекса внутри клетки:
     при флексе высоту делила подпись, и трёхстрочная подпись отнимала
     четырнадцать пикселей у своей сцены. Строки сцен и строки подписей ложатся
     на общие линии подсеткой, и ряд из девяти состояний переносится на вторую
     пару строк, не теряя выравнивания. */
  .spec-cell { display: grid; grid-template-rows: subgrid; grid-row: span 2;
               align-self: stretch; }
  .spec-stage { display: flex; align-items: flex-start; }
  .spec-cell.hole { visibility: hidden; }
  /* Поле с ошибкой — ДВЕ вещи одна под другой, а не два соседа в ряд:
     клетка сцены сама по себе флекс-ряд, и надпись об ошибке вставала
     справа от поля, сплющив его вдвое и вылезши за дорожку таблицы. */
  .field-case { display: flex; flex-direction: column; align-items: flex-start; }

  /* 74. «Уменьшить прозрачность»: скрим становится непрозрачным, и из-под него
     видна одна карточка в пустоте — ни своей колонки, ни шапки. Кадр 30 в той
     же ситуации решает наоборот: инспектор занимает плиту и становится видом.
     Одно противоречие не имеет права быть решено в двух местах по-разному. */
  .win.min .overlay-insp, .win.rt .overlay-insp {
        inset: 0; width: auto; border-radius: var(--r-xl); }
  .win.min .board-scrim, .win.rt .board-scrim { display: none; }
  /* Панель растянулась во всю плиту — и утащила за собой строку: разбор
     артефакта шёл в сто десять знаков, вдвое длиннее того, что читают без
     потери строки. Ширина ПАНЕЛИ и ширина КОЛОНКИ ТЕКСТА — разные величины;
     растягивается панель, колонка остаётся той же, что и в плавающем слое.
     Кнопки прижаты к правому краю колонки, а не панели, — флаг один. */
  .win.min .overlay-insp .insp-head, .win.rt .overlay-insp .insp-head,
  .win.min .overlay-insp .artifact, .win.rt .overlay-insp .artifact,
  .win.min .overlay-insp .actionbar, .win.rt .overlay-insp .actionbar {
        max-width: 66ch; }

  .spec .spec-set { grid-template-columns: repeat(6, 1fr); }

  /* 75. ИНСПЕКТОР ХОДА АГЕНТА. Половина доски живёт в этом состоянии, и оно
     было единственным без нарисованного инспектора: прогресс по задачам сняли
     с карточки под обещание «он живёт в инспекторе», а инспектора этого
     не существовало. Задачи — список, а не степпер: степпер восемью
     безымянными кружками не говорил, что такое стадия 6, а список называет
     каждую задачу словом, и «приняты 4 из 7» пересчитывается глазами. */
  .tasks { display: flex; flex-direction: column; gap: 6px;
           margin: var(--s2) 0 var(--s3); }
  .tk { display: flex; align-items: flex-start; gap: var(--s2); }
  .tk-n, .thread .qn { display: inline-flex; align-items: center; justify-content: center;
          flex: none; width: 18px; height: 18px; border-radius: 5px;
          background: var(--bg-overlay); color: var(--t-tertiary); font-weight: 700; }
  .tk-t { color: var(--t-secondary); }
  .tk.done .tk-t { color: var(--t-tertiary); }
  .tk.live .tk-n { background: rgba(255,255,255,0.22); color: var(--t-primary); }
  .tk.live .tk-t { color: var(--t-primary); }
  .win .tk-t, .win .tk { font-size: 13px; line-height: 18px; }
  .win .tk-n { font-size: 11px; line-height: 14px; }

</style>
