# SwiftLint — статический анализ стиля и сложности (аналог Checkstyle/SpotBugs).
# Установка:  brew install swiftlint
# Проверка:   swiftlint            (из корня репозитория)
# Автофиксы:  swiftlint --fix
#
# Роль — ЛИНТ (сложность, длины тел/файлов), не форматтер: форматирование держит
# Apple swift-format по .swift-format (его же гоняет CI). Второго форматтера в
# проекте нет намеренно — два форматтера сразу это анти-пример (практики 07.1).
#
# Инвариант проекта: ноль визуальных изменений. Линт правит только исходники,
# не поведение и не пиксели, но перед массовым --fix всё равно прогонять сборку.

included:
  - Packages/Foundry/Sources
  - Packages/Foundry/Tests
  - App

excluded:
  - .build
  - Packages/Foundry/.build
  - Packages/Foundry/scratchpad
  # DesignTokens генерится из tokens.json — форматировать/линтить генерат нельзя.
  # (SwiftLint не понимает шапку // swift-format-ignore-file — исключаем путём.)
  - Packages/Foundry/Sources/Core/DesignSystem/DesignTokens.swift

# Роль линтера — комплементарная форматтеру: он держит запятые и ширину строки,
# линтер — сложность/длины/семантику. Поэтому глушим правила, которые (а) дублируют
# и КОНФЛИКТУЮТ с swift-format, или (б) воюют с намеренными идиомами проекта.
disabled_rules:
  # Ширину и висячие запятые держит swift-format (.swift-format, lineLength 110):
  # SwiftLint здесь только столкнул бы линтер с форматтером лбами.
  - line_length
  - trailing_comma
  # SwiftUI-идиома: вью с onTap-замыканием + trailing-контентом (SettingRow(...) { ... }).
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - closure_spacing
  - contains_over_first_not_nil
  - sorted_first_last

identifier_name:
  min_length: 2
  # Короткие имена уместны в математике/Metal/рисовании путей (координаты, каналы
  # цвета, индексы, углы/параметры кривых, матрицы, точки Path).
  excluded: [x, y, z, w, r, g, b, a, c, d, e, h, m, p, t, u, id, dt, ok, i, j, n, s, f]

# Локальные координатные кортежи (x1,y1,x2,y2) в коде рисования — норма; правило
# остаётся для настоящих god-кортежей (5+ членов → просят структуру).
large_tuple:
  warning: 4
  error: 6

# Соглашение BC: у метода/инициализатора ВСЕГДА явная внешняя метка — никаких `_`,
# глушащих имя аргумента (метод читается фразой: change(theme:), write(dto:named:)).
# Исключены UI-слои (Presentation/DesignSystem/OrbBench): там сигнатуры
# Apple-протоколов (updateNSView(_:), mtkView(_:), dismantleNSView(_:)) обязаны нести
# `_` — их не переписать. Замыкания ({ _ in }) правило не трогает: там нет метки.
custom_rules:
  no_underscore_argument_label:
    name: "Underscore Argument Label"
    regex: '(func\s+\w+|\binit)\s*\(_\s+\w+:'
    message: "Глушить метку через `_` нельзя — дать явную внешнюю метку (соглашения BC)."
    severity: warning
    excluded: ".*/(Presentation|DesignSystem|OrbBench)/.*"

type_name:
  min_length: 2

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 400
  error: 550
  ignore_comment_only_lines: true
