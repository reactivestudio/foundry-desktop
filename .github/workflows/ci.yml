name: '[CI] PR checks'

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-changes:
    name: Проверить изменения
    # Раннер пиннится осознанно, не macos-latest: от версии зависят снапшот-голдены
    # (практики, глава 07 §4). macOS-минуты стоят 10× Linux — держим одну тонкую джобу.
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Получить исходники
        uses: actions/checkout@v7

      - name: Восстановить кэш SPM
        uses: actions/cache@v6
        with:
          path: |
            Packages/Foundry/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Проверить форматирование
        run: |
          swift format lint --strict --recursive \
            Packages/Foundry/Sources Packages/Foundry/Tests App

      # Линт комплементарен форматтеру: сложность/длины/семантика (.swiftlint.yml),
      # а не форматирование. swiftlint на образе macos не предустановлен — ставим
      # (guard: если будущий образ его включит, brew-шаг пропустится).
      - name: Линт (SwiftLint)
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --strict --quiet

      - name: Прогнать тесты пакета
        working-directory: Packages/Foundry
        run: swift test

      # Приложение собирается без подписи: проверяем, что xcodeproj + пакет
      # сходятся, а не готовим дистрибутив (этим занят release.yml).
      #
      # skip-флаги — цена внешнего пакета: макросы и build-плагины из ЧУЖОГО
      # репозитория Xcode держит недоверенными, пока человек не нажмёт «Trust» в
      # диалоге. В CI нажимать некому, а Spark — наш же пакет с пиннутой версией:
      # доверие тут решается ревью Package.resolved, а не модалкой.
      - name: Собрать приложение
        run: |
          set -o pipefail
          xcodebuild build \
            -project Foundry.xcodeproj \
            -scheme Foundry \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY=- \
            | xcbeautify
